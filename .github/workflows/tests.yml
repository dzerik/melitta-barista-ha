name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant
          pip install pytest-homeassistant-custom-component
          pip install pytest-cov pytest-timeout
          pip install bleak bleak-retry-connector pycryptodome aiosqlite
          pip install pyserial pyudev aiousbwatcher

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --timeout=30 \
            --cov=custom_components/melitta_barista \
            --cov-report=term-missing \
            --cov-report=xml \
            -q

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install linters
        run: pip install ruff bandit

      - name: Ruff
        run: ruff check custom_components/melitta_barista/

      - name: Bandit
        run: bandit -r custom_components/melitta_barista/ -ll
