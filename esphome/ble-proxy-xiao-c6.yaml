# ESPHome BLE Proxy — Seeed Studio XIAO ESP32-C6
#
# Full active Bluetooth proxy for Home Assistant.
# Replaces unstable USB BT adapter with a reliable WiFi-based BLE bridge.
#
# Hardware: Seeed Studio XIAO ESP32-C6
#   - RISC-V single-core @ 160MHz
#   - BLE 5.0 + WiFi 6 (802.11ax) 2.4GHz — 11ax is compiled in and
#     negotiated automatically by ESP-IDF; no sdkconfig tweaks needed
#   - Onboard antenna + U.FL connector for external antenna
#   - User LED on GPIO15
#
# Flash:
#   1. First time (USB): esphome run ble-proxy-xiao-c6.yaml
#   2. Subsequent: OTA from HA ESPHome dashboard
#
# After flashing, HA auto-discovers the proxy.
# Remove the old USB BT adapter — it's no longer needed.
# ---------------------------------------------------------------

substitutions:
  name: "ble-proxy-melitta"
  friendly_name: "BLE Proxy Melitta"
  # The machine advertises this service UUID (same matcher as the
  # integration's manifest.json) — used by the RSSI/presence sensors below.
  melitta_service_uuid: "0000ad00-b35c-11e4-9813-0002a5d5c51b"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  # Require 2026.7.0+. Cumulative BLE-proxy fixes this floor guarantees:
  #  - 2025.8: top-level `api.actions:` schema used by the recovery
  #    actions below.
  #  - 2026.5: ESP_COEX_PREFER_BT held for the full lifetime of a BLE
  #    connection (PR #16036) — fixes status=0x85/133 GATT failures under
  #    heavy WiFi load, the connection-reliability class of the pairing
  #    wedge this proxy fights.
  #  - 2026.5.1: slot leak fixed (PR #16588) — a dropped ESP-IDF CLOSE_EVT
  #    no longer burns a connection slot until reboot. With only 3 slots
  #    here, one leaked slot materially degrades the proxy, and the
  #    reconnect churn of a pairing wedge is exactly the workload that
  #    triggered it.
  #  - 2026.7.0: stale advertisement subscriber is taken over instead of
  #    rejecting the new one (PR #17423) — cures "proxy connected but no
  #    advertisements" after an HA restart within the ~150s keepalive
  #    window, which previously looked like a pairing wedge.
  # Tradeoff: while a long-lived BLE connection is up, this ESP may show
  # slightly lower WiFi throughput — negligible for a dedicated proxy.
  # NOTE on 2026.7.x builds: ESP32 compiles with the native ESP-IDF
  # toolchain by default now — the first build re-downloads the toolchain
  # and does a full rebuild. Prefer USB-reachable conditions for the first
  # reflash. The pip/pipx CLI needs Python 3.12+.
  min_version: 2026.7.0
  # Power up the FM8625H RF switch and select the antenna on boot.
  on_boot:
    priority: 600
    then:
      # rf_switch_enable output is inverted (GPIO3 is ACTIVE-LOW): turning
      # it ON drives the pin LOW, which powers the RF switch. Seeed's
      # reference sequence waits ~100ms for the FM8625H to power up before
      # selecting the antenna.
      - output.turn_on: rf_switch_enable
      - delay: 100ms
      # LOW = onboard antenna, HIGH = external U.FL antenna
      # Change to turn_on if using external antenna
      - output.turn_off: rf_antenna_select

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf
    # Deliberately NO `version:` pin — ESPHome's recommended ESP-IDF
    # (5.5.4+) is what we want. NEVER pin 5.5.2: it shipped a BT-controller
    # regression (espressif/esp-idf#18217) where BLE scanning silently dies
    # after hours/days with an HCI 0x200c timeout.

# Safe-mode boot counter in RTC memory instead of NVS — spares a flash
# write on every boot (2026.7.0+). Tradeoff: the counter doesn't survive a
# full power loss, so a power-cycle resets the escalation — fine for a proxy.
safe_mode:
  storage: rtc

# ---------------------------------------------------------------
# Network
# ---------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE          # Max performance for BLE proxy
  # 802.11k/v roaming — uncomment in multi-AP / mesh homes: a proxy stuck
  # on a distant AP after a topology change produces latency spikes that
  # turn into GATT status=133 under the coex regime. No benefit on a
  # single AP, and rare AP firmwares misbehave with BTM.
  # enable_btm: true
  # enable_rrm: true

  # Fallback AP in case WiFi fails (for recovery)
  ap:
    ssid: "${name}-fallback"
    password: !secret fallback_ap_password

captive_portal:

# WiFi reprovisioning over the USB-C port (improv-wifi.com / ESPHome Web) —
# complements the fallback AP without rebuilding firmware. Works over the
# USB_SERIAL_JTAG logger below. Deliberately NOT esp32_improv: that would
# pull a GATT server + advertising onto the BLE controller shared with the
# proxy — worst on this single-core chip.
improv_serial:

# ---------------------------------------------------------------
# Home Assistant API + OTA
# ---------------------------------------------------------------
api:
  encryption:
    key: !secret api_encryption_key
  # Built-in watchdog: self-reboot if no HA client connects for this long.
  # This is the ESPHome default made explicit — do NOT add a custom
  # interval/script watchdog on top, it would duplicate this.
  reboot_timeout: 15min
  on_client_disconnected:
    - lambda: 'id(api_disconnect_count) += 1;'
  # Manual recovery action — call from HA Developer Tools or from
  # automations when pairing gets wedged. Clears the ESP32's BLE bond
  # table (esp_ble_remove_bond_device for every stored peer) so the
  # next `pair=True` from a Bluetooth-proxy client triggers a fresh
  # SMP exchange instead of presenting a stale LTK. See
  # https://github.com/dzerik/melitta-barista-ha/issues/10
  #
  # NOTE: this clear-ALL action has no built-in equivalent, so it stays.
  # Per-peer operations (unpair / disconnect / clear GATT cache) ARE
  # available natively via the proxy API — the integration can call
  # BleakClient.unpair() / clear_cache() on a live ESPHome-backed client.
  #
  # In HA: Developer Tools → Services →
  #   esphome.${name}_clear_ble_bonds → Call service
  # Then call melitta_barista.repair_connection (or use the panel's
  # Repair button) so the integration reconnects with the fresh bond.
  actions:
    - action: clear_ble_bonds
      then:
        - lambda: |-
            ESP_LOGW("ble_bonds", "Clearing all BLE bonds via HA service");
            int dev_num = esp_ble_get_bond_device_num();
            esp_ble_bond_dev_t dev_list[dev_num];
            esp_ble_get_bond_device_list(&dev_num, dev_list);
            for (int i = 0; i < dev_num; i++) {
              esp_ble_remove_bond_device(dev_list[i].bd_addr);
            }
            ESP_LOGW("ble_bonds", "Removed %d bonded device(s)", dev_num);
        - event.trigger:
            id: bond_change
            event_type: bonds_cleared

    # Surgical disconnect of a specific peer when bluetooth_proxy gets
    # stuck in `state: ESTABLISHED` after an `auth fail reason=82` (SMP
    # rejection from the peer). The connection slot keeps a half-closed
    # link and ignores fresh client-side connect requests; this forces
    # the GAP layer to drop it so the next request actually opens a
    # new SMP exchange.
    #
    # NOTE: the 2026.5 coex fix + the 2026.5.1 slot-leak fix sharply reduce
    # the *connection-reliability* wedge, so this action should fire far
    # less often. It does NOT address the stale-bond SMP rejection
    # (reason=82) itself — clear_ble_bonds above remains the tool for that.
    # Unlike the native API DISCONNECT (which goes through the proxy's
    # tracked connection object), this raw GAP disconnect also works on
    # links the proxy no longer tracks. Keep both as fallbacks.
    #
    # In HA: Developer Tools → Services →
    #   esphome.${name}_disconnect_ble_peer
    #   data: {peer_mac: "F1:2C:72:3F:75:ED"}
    - action: disconnect_ble_peer
      variables:
        peer_mac: string
      then:
        - lambda: |-
            esp_bd_addr_t bd_addr;
            int parsed = sscanf(peer_mac.c_str(),
              "%hhx:%hhx:%hhx:%hhx:%hhx:%hhx",
              &bd_addr[0], &bd_addr[1], &bd_addr[2],
              &bd_addr[3], &bd_addr[4], &bd_addr[5]);
            if (parsed == 6) {
              esp_err_t err = esp_ble_gap_disconnect(bd_addr);
              ESP_LOGW("ble_disconnect", "GAP disconnect %s -> %d",
                peer_mac.c_str(), (int) err);
            } else {
              ESP_LOGE("ble_disconnect", "Invalid MAC: %s", peer_mac.c_str());
            }

    # Middle-tier recovery between disconnect_ble_peer (surgical) and
    # Restart/Factory reset (nuclear): tear down the whole BLE stack and
    # reinitialize it WITHOUT rebooting the ESP and WITHOUT touching NVS
    # bonds. Clears wedged GAP/GATT controller state; WiFi/API stay up.
    - action: restart_ble
      then:
        - ble.disable:
        - delay: 2s
        - ble.enable:

ota:
  - platform: esphome
    password: !secret ota_password

# ---------------------------------------------------------------
# Logging — reduce noise, keep useful info
# ---------------------------------------------------------------
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG   # XIAO C6 uses USB-JTAG for serial
  logs:
    bluetooth_proxy: INFO
    esp32_ble_tracker: WARN        # Suppress per-advertisement spam
    component: ERROR

# ---------------------------------------------------------------
# Bluetooth — core proxy functionality
#
# ESP32-C6 is single-core RISC-V. Aggressive scan parameters
# (1100ms/1100ms) cause CPU contention between WiFi and BLE.
# Use defaults and on-demand scanning for stable operation.
# See: https://esphome.io/components/bluetooth_proxy/
#
# Slot accounting (2026.5+): only bluetooth_proxy consumes connection
# slots — the scanner does NOT reserve one; its ADV/SCAN instance is added
# by codegen ON TOP of max_connections (CONFIG_BT_ACL_CONNECTIONS =
# max_connections + 1). The esp32_ble default (max_connections: 3) exactly
# matches connection_slots: 3 below, so no explicit esp32_ble block is
# needed. Each extra connection costs ~1KB RAM on this RAM-constrained
# single-core chip — don't over-allocate.
#
# Pairing-resilience experiment (issue #33, SMP auth fail reason=82):
# pin the SMP auth request explicitly instead of relying on the Bluedroid
# default. Uncomment if the wedge recurs:
# esp32_ble:
#   auth_req_mode: bond
# ---------------------------------------------------------------
esp32_ble_tracker:
  scan_parameters:
    # Use ESPHome defaults (interval=320ms, window=30ms).
    # Aggressive scanning provides no benefit on WiFi proxies
    # while increasing CPU usage on single-core chips.
    active: true        # Active scan for full device names

bluetooth_proxy:
  active: true           # REQUIRED for GATT connections (Melitta needs this)
  # Cache BLE service discovery in NVS — faster reconnects. Gotchas:
  #  - flipping this to false does NOT purge an already-written cache
  #    (only a full flash erase / Factory reset does; a false+reflash
  #    cycle also cleans it on connect);
  #  - after a machine firmware update a stale cache yields wrong
  #    attribute handles / status=133 on reconnect — symptoms easily
  #    mistaken for a bond problem. Recovery: clear_cache() from the
  #    integration's repair flow, or the Factory reset button below.
  cache_services: true
  connection_slots: 3    # 3 is safe for C6 RAM; max recommended 5

# ---------------------------------------------------------------
# Antenna control — FM8625H RF switch on XIAO ESP32-C6
# Board pin aliases (since ESPHome 2025.12): RF_SWITCH_EN=GPIO3,
# RF_ANT_SELECT=GPIO14. (Don't use the board's LED alias — it maps to
# GPIO8, contradicting Seeed's documented GPIO15 user LED.)
# ---------------------------------------------------------------
output:
  - platform: gpio
    id: rf_switch_enable
    pin:
      number: RF_SWITCH_EN    # GPIO3 — enables the RF switch IC
      # ACTIVE-LOW per Seeed reference code: LOW powers the FM8625H.
      # Inverted so that output.turn_on == "switch powered".
      inverted: true

  - platform: gpio
    id: rf_antenna_select
    pin: RF_ANT_SELECT        # GPIO14 — LOW=onboard, HIGH=external

switch:
  - platform: template
    name: "External Antenna"
    id: external_antenna
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - output.turn_on: rf_antenna_select
    turn_off_action:
      - output.turn_off: rf_antenna_select

# ---------------------------------------------------------------
# Status LED — GPIO15 (active LOW on XIAO C6)
# ---------------------------------------------------------------
light:
  - platform: status_led
    name: "Status LED"
    id: board_status_led
    pin:
      number: GPIO15
      inverted: true
      ignore_strapping_warning: true
    internal: true         # Don't expose to HA, just for visual status

# ---------------------------------------------------------------
# Diagnostics — monitor proxy health in HA
# ---------------------------------------------------------------
globals:
  - id: api_disconnect_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_bond_count
    type: int
    restore_value: no
    initial_value: '-1'

# Heap / loop-time / reset-reason instrumentation. On the single-core C6
# rising loop_time + falling free heap under simultaneous WiFi+BLE load is
# the leading indicator of the status=133 drop class; reset_reason tells
# brownout vs task-watchdog vs panic after an unexplained reboot.
# Keep update_interval >= 30s here: the heap-integrity walk behind
# block/fragmentation is O(heap).
debug:
  update_interval: 60s

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 300s
    entity_category: diagnostic

  # Live signal strength of the machine as seen from the proxy — the #1
  # diagnostic for reconnect failures, placement, and A/B-testing the
  # onboard vs external antenna. NOTE: freezes at the last-seen value
  # while a GATT connection is up (the machine stops advertising during
  # active sessions).
  - platform: ble_rssi
    service_uuid: ${melitta_service_uuid}
    name: "Melitta RSSI"
    entity_category: diagnostic

  # Die temperature — a proxy near a coffee machine (heat source, often
  # in an enclosure) can run hot; >80°C degrades RF sensitivity and
  # WiFi/BLE coex stability. Correlate thermal events with drops in HA.
  - platform: internal_temperature
    name: "Chip Temperature"
    update_interval: 60s
    entity_category: diagnostic

  # How many times the HA API link dropped since boot — after a flaky
  # night this is the first number to look at.
  - platform: template
    name: "API Disconnects"
    lambda: 'return id(api_disconnect_count);'
    update_interval: 60s
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: debug
    free:
      name: "Heap Free"
    fragmentation:
      name: "Heap Fragmentation"
    loop_time:
      name: "Loop Time"

binary_sensor:
  # "Advertising seen" — distinguishes 'machine off / out of range' from
  # 'machine advertises but HA cannot connect', the two failure modes
  # users otherwise cannot tell apart. NOT "machine reachable": drops to
  # off while the proxy holds a GATT connection (no adverts) and when the
  # machine is connected to the phone app.
  - platform: ble_presence
    service_uuid: ${melitta_service_uuid}
    name: "Melitta Advertising"
    timeout: 90s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic

  # Live read of the on-chip BLE bond table — useful to confirm
  # clear_ble_bonds actually emptied NVS, or to see whether the
  # next pair=True actually stored anything. Also fires the
  # "BLE Bond Change" event below when the count changes.
  - platform: template
    name: "BLE bonds"
    id: ble_bonds_count
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      int n = esp_ble_get_bond_device_num();
      if (id(last_bond_count) >= 0 && n != id(last_bond_count)) {
        id(bond_change).trigger(
          n > id(last_bond_count) ? "bond_added" : "bond_removed");
      }
      id(last_bond_count) = n;
      char buf[8];
      snprintf(buf, sizeof(buf), "%d", n);
      return std::string(buf);

  - platform: debug
    reset_reason:
      name: "Reset Reason"

# Logbook/automation hook for the exact moment a bond appeared or
# vanished — the central forensic question in every pairing-wedge report.
event:
  - platform: template
    name: "BLE Bond Change"
    id: bond_change
    entity_category: diagnostic
    event_types:
      - bond_added
      - bond_removed
      - bonds_cleared

button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: diagnostic

  # Reboot the proxy into safe mode — disables all components except
  # API + OTA. Use this if a bad config (or a buggy custom action)
  # leaves the device unresponsive; safe-mode boot lets you OTA-flash
  # a fixed config without physical access.
  - platform: safe_mode
    name: "Safe Mode Boot"
    entity_category: diagnostic

  # NUCLEAR OPTION — wipes ALL NVS storage: bond table, ESPHome
  # cached state, every Preference. WiFi credentials and OTA password
  # are baked into the firmware at flash time (from secrets.yaml),
  # so they survive. Use this when clear_ble_bonds isn't enough and
  # you suspect deeper NVS corruption (e.g. stale OTA artifacts or
  # the proxy refuses to bond no matter what). After pressing, the
  # device reboots clean — Melitta integration → Repair will then
  # see a virgin ESP and run a fresh SMP exchange on the next pair.
  #
  # Hardening note: 2026.7.0+ offers opt-in NVS encryption (protects the
  # BLE bond table / LTK at rest) — NOT enabled here because it requires
  # burning an eFuse HMAC key, which is permanent and complicates
  # factory-reset/reflash workflows. Only for security-sensitive setups.
  - platform: factory_reset
    name: "Factory reset"
    entity_category: diagnostic

# ---------------------------------------------------------------
# Optional extras — disabled by default
# ---------------------------------------------------------------
# Standalone web UI (sensors + buttons at http://<proxy-ip>) for when HA
# or the API link is down. WARNING for this single-core chip: with active
# BLE + WiFi the extra ~20-40KB heap and per-request CPU can itself
# provoke the contention it is meant to debug. Prefer the S3 for this.
# Requires `web_server_password` in secrets.yaml.
# web_server:
#   port: 80
#   version: 3
#   auth:
#     type: digest
#     username: admin
#     password: !secret web_server_password

# Nightly maintenance restart at 04:00 — clears slow heap fragmentation
# and any half-wedged BLE controller state before the morning coffee
# window. Opt-in because a restart drops any live GATT link (at 04:00 the
# machine is normally off, so usually harmless).
# time:
#   - platform: sntp
#     id: sntp_time
#     on_time:
#       - hours: 4
#         minutes: 0
#         seconds: 0
#         then:
#           - button.press: restart_button
